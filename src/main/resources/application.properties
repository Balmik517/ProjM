# H2 embedded database (fallback for standalone mode)
spring.datasource.url=jdbc:h2:mem:legacydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true
server.port = 8086

# Legacy connection pool settings (deprecated Tomcat pool properties)
spring.datasource.tomcat.max-active=50
spring.datasource.tomcat.max-idle=15
spring.datasource.tomcat.min-idle=5
spring.datasource.tomcat.initial-size=5
spring.datasource.tomcat.max-wait=20000
spring.datasource.tomcat.validation-query=SELECT 1
spring.datasource.tomcat.test-on-borrow=true
spring.datasource.tomcat.test-while-idle=true
spring.datasource.tomcat.time-between-eviction-runs-millis=5000
spring.datasource.tomcat.min-evictable-idle-time-millis=30000

# Legacy Hibernate properties
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.connection.autocommit=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Legacy server settings
server.servlet.session.timeout=3600
server.servlet.session.cookie.http-only=true
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# Legacy file upload settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Mail settings (javax.mail)
mail.smtp.host=smtp.example.com
mail.smtp.port=587
mail.smtp.username=admin@example.com
mail.smtp.password=password
mail.from=noreply@example.com

# Notification webhook
notification.webhook.url=http://localhost:9090/webhook/notifications

# Legacy JNDI configuration (for EJB-style lookups)
spring.jndi.enabled=false
