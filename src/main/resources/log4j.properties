# Log4j 1.x Configuration (legacy - has known CVEs)
log4j.rootLogger=INFO, console, file

# Console appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1} - %m%n

# Rolling file appender
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/application.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c - %m%n

# Package-level logging
log4j.logger.com.pma.spring.web=DEBUG
log4j.logger.com.pma.spring.web.controller=DEBUG
log4j.logger.com.pma.spring.web.service=DEBUG
log4j.logger.com.pma.spring.web.dao=DEBUG
log4j.logger.com.pma.spring.web.filter=INFO
log4j.logger.com.pma.spring.web.interceptor=INFO
log4j.logger.com.pma.spring.web.cache=INFO
log4j.logger.com.pma.spring.web.scheduler=INFO

# Hibernate SQL logging
log4j.logger.org.hibernate.SQL=DEBUG
log4j.logger.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring framework logging
log4j.logger.org.springframework=INFO
log4j.logger.org.springframework.web=DEBUG

# Quartz logging
log4j.logger.org.quartz=INFO
